<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Aluno — Peregrinos Intercâmbio</title>
<link rel="stylesheet" href="style.css?v=1790780261">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="auth-body">
  <div class="lang-switcher"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <img class="auth-logo" src="assets/peregrinos-logo-stacked.png" alt="Peregrinos Intercâmbio">
    </div>

    <h1 class="auth-title" data-i18n="aluno.title">Área do Aluno</h1>
    <p class="auth-subtitle" data-i18n="aluno.loginSubtitle">Entre para acompanhar sua jornada de intercâmbio com a Peregrinos.</p>

    <form id="aluno-login-form" class="auth-form">
      <label><span data-i18n="auth.email">E-mail</span>
        <input type="email" id="aluno-login-email" required placeholder="voce@email.com" autocomplete="username">
      </label>
      <label><span data-i18n="auth.password">Senha</span>
        <input type="password" id="aluno-login-password" required placeholder="••••••••" autocomplete="current-password">
      </label>

      <div class="public-message info" id="aluno-login-info" style="display:none;"></div>

      <button type="submit" class="btn btn-primary auth-submit" data-i18n="auth.signIn">Entrar</button>
      <button type="button" class="auth-forgot-link" id="aluno-login-forgot-toggle" data-i18n="auth.forgotPassword">Esqueci minha senha</button>
    </form>

    <form id="aluno-forgot-form" class="auth-form" style="display:none;">
      <p class="auth-subtitle" style="margin:0;" data-i18n="auth.forgotInstructions">Informe seu e-mail para receber o link de redefinição de senha.</p>
      <label><span data-i18n="auth.email">E-mail</span>
        <input type="email" id="aluno-forgot-email" required placeholder="voce@email.com" autocomplete="username">
      </label>
      <div class="public-message info" id="aluno-forgot-info" style="display:none;"></div>
      <button type="submit" class="btn btn-primary auth-submit" data-i18n="auth.sendLink">Enviar link</button>
      <button type="button" class="auth-forgot-link" id="aluno-login-forgot-back" data-i18n="auth.backToLogin">Voltar para o login</button>
    </form>

    <p class="auth-forgot-link" style="cursor:default; margin-top:14px;" data-i18n="aluno.noAccess">Ainda não tem acesso? Fale com seu consultor.</p>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js?v=1790780261"></script>
  <script src="area-aluno-login.js?v=1790780261"></script>
</body>
</html>
