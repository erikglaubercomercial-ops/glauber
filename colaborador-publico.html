<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de colaborador — Peregrinos Intercâmbio</title>
<link rel="stylesheet" href="style.css?v=1790620492">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="lang-switcher"></div>
  <div class="public-page">
    <div class="public-card">
      <img class="public-logo" src="assets/peregrinos-logo-stacked.png" alt="Peregrinos Intercâmbio">

      <div id="pc-content">
        <h1 class="public-title" data-i18n="colab.title">Bem-vindo(a) à Peregrinos!</h1>
        <p class="public-subtitle" data-i18n="colab.subtitle">Preencha seus dados abaixo para completar seu cadastro como colaborador(a).</p>

        <div class="public-message success" id="pc-success" style="display:none;" data-i18n="colab.success">Dados enviados! Nossa equipe vai concluir seu cadastro em breve.</div>

        <form class="public-form" id="pc-form">
          <div class="public-section-title" data-i18n="colab.sectionPersonal">Dados pessoais</div>
          <label><span data-i18n="colab.fullName">Nome completo *</span>
            <input type="text" id="pc-name" required placeholder="Ex: João Pereira">
          </label>
          <label><span data-i18n="colab.birthDate">Data de nascimento</span>
            <input type="date" id="pc-birth-date">
          </label>
          <label><span data-i18n="colab.nationality">Nacionalidade</span>
            <input type="text" id="pc-nationality" placeholder="Ex: Brasileira">
          </label>
          <label><span data-i18n="matricula.cpf">CPF</span>
            <input type="text" id="pc-cpf" placeholder="000.000.000-00">
          </label>
          <label><span data-i18n="colab.rg">RG</span>
            <input type="text" id="pc-rg">
          </label>
          <label><span data-i18n="colab.maritalStatus">Estado civil</span>
            <select id="pc-marital-status">
              <option value="" data-i18n="common.select">Selecione</option>
              <option value="Solteiro(a)" data-i18n="colab.single">Solteiro(a)</option>
              <option value="Casado(a)" data-i18n="colab.married">Casado(a)</option>
              <option value="Divorciado(a)" data-i18n="colab.divorced">Divorciado(a)</option>
              <option value="Viúvo(a)" data-i18n="colab.widowed">Viúvo(a)</option>
              <option value="União estável" data-i18n="colab.domesticPartnership">União estável</option>
              <option value="Outro" data-i18n="common.other">Outro</option>
            </select>
          </label>
          <label><span data-i18n="colab.phone">Telefone / WhatsApp</span>
            <input type="text" id="pc-phone" placeholder="Ex: (11) 99999-0000">
          </label>
          <label><span data-i18n="colab.personalEmail">E-mail pessoal</span>
            <input type="email" id="pc-email">
          </label>

          <div class="public-section-title" data-i18n="emerg.section">Contato de emergência</div>
          <label><span data-i18n="emerg.name">Nome</span>
            <input type="text" id="pc-emergency-name">
          </label>
          <label><span data-i18n="emerg.relationship">Parentesco</span>
            <input type="text" id="pc-emergency-relationship" placeholder="Ex: Mãe, cônjuge, irmão..." data-i18n-placeholder="emerg.relationshipPlaceholder">
          </label>
          <label><span data-i18n="emerg.phone">Telefone</span>
            <input type="text" id="pc-emergency-phone">
          </label>

          <div class="public-section-title" data-i18n="addr.section">Endereço</div>
          <label><span data-i18n="addr.street">Rua</span>
            <input type="text" id="pc-street">
          </label>
          <label><span data-i18n="addr.number">Número</span>
            <input type="text" id="pc-number">
          </label>
          <label><span data-i18n="addr.complement">Complemento</span>
            <input type="text" id="pc-complement" placeholder="Apto, bloco... (opcional)" data-i18n-placeholder="addr.complementPlaceholder">
          </label>
          <label><span data-i18n="addr.neighborhood">Bairro</span>
            <input type="text" id="pc-neighborhood">
          </label>
          <label><span data-i18n="addr.city">Cidade</span>
            <input type="text" id="pc-city">
          </label>
          <label><span data-i18n="addr.state">Estado</span>
            <input type="text" id="pc-state" maxlength="2" placeholder="Ex: SP">
          </label>
          <label><span data-i18n="addr.zip">CEP</span>
            <input type="text" id="pc-zip" placeholder="00000-000">
          </label>

          <div class="public-section-title" data-i18n="colab.sectionPhoto">Foto</div>
          <label><span data-i18n="colab.profilePhoto">Foto de perfil</span>
            <input type="file" id="pc-photo" accept="image/*">
          </label>

          <button type="submit" class="btn btn-primary" id="pc-submit" data-i18n="common.sendMyData">Enviar meus dados</button>
        </form>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js?v=1790620492"></script>
  <script src="colaborador-publico.js"></script>
</body>
</html>
