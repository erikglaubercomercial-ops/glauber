<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de colaborador — Peregrinos Intercâmbio</title>
<link rel="stylesheet" href="style.css?v=1790162213">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="public-page">
    <div class="public-card">
      <img class="public-logo" src="assets/peregrinos-logo-stacked.png" alt="Peregrinos Intercâmbio">

      <div id="pc-content">
        <h1 class="public-title">Bem-vindo(a) à Peregrinos!</h1>
        <p class="public-subtitle">Preencha seus dados abaixo para completar seu cadastro como colaborador(a).</p>

        <div class="public-message success" id="pc-success" style="display:none;">Dados enviados! Nossa equipe vai concluir seu cadastro em breve.</div>

        <form class="public-form" id="pc-form">
          <div class="public-section-title">Dados pessoais</div>
          <label>Nome completo *
            <input type="text" id="pc-name" required placeholder="Ex: João Pereira">
          </label>
          <label>Data de nascimento
            <input type="date" id="pc-birth-date">
          </label>
          <label>Nacionalidade
            <input type="text" id="pc-nationality" placeholder="Ex: Brasileira">
          </label>
          <label>CPF
            <input type="text" id="pc-cpf" placeholder="000.000.000-00">
          </label>
          <label>RG
            <input type="text" id="pc-rg">
          </label>
          <label>Estado civil
            <select id="pc-marital-status">
              <option value="">Selecione</option>
              <option value="Solteiro(a)">Solteiro(a)</option>
              <option value="Casado(a)">Casado(a)</option>
              <option value="Divorciado(a)">Divorciado(a)</option>
              <option value="Viúvo(a)">Viúvo(a)</option>
              <option value="União estável">União estável</option>
              <option value="Outro">Outro</option>
            </select>
          </label>
          <label>Telefone / WhatsApp
            <input type="text" id="pc-phone" placeholder="Ex: (11) 99999-0000">
          </label>
          <label>E-mail pessoal
            <input type="email" id="pc-email">
          </label>

          <div class="public-section-title">Contato de emergência</div>
          <label>Nome
            <input type="text" id="pc-emergency-name">
          </label>
          <label>Parentesco
            <input type="text" id="pc-emergency-relationship" placeholder="Ex: Mãe, cônjuge, irmão...">
          </label>
          <label>Telefone
            <input type="text" id="pc-emergency-phone">
          </label>

          <div class="public-section-title">Endereço</div>
          <label>Rua
            <input type="text" id="pc-street">
          </label>
          <label>Número
            <input type="text" id="pc-number">
          </label>
          <label>Complemento
            <input type="text" id="pc-complement" placeholder="Apto, bloco... (opcional)">
          </label>
          <label>Bairro
            <input type="text" id="pc-neighborhood">
          </label>
          <label>Cidade
            <input type="text" id="pc-city">
          </label>
          <label>Estado
            <input type="text" id="pc-state" maxlength="2" placeholder="Ex: SP">
          </label>
          <label>CEP
            <input type="text" id="pc-zip" placeholder="00000-000">
          </label>

          <div class="public-section-title">Documentos</div>
          <label>Foto do RG/CPF
            <input type="file" id="pc-id-document" accept="image/*,.pdf">
          </label>
          <label>Comprovante de residência
            <input type="file" id="pc-address-proof" accept="image/*,.pdf">
          </label>
          <label>Foto 3x4
            <input type="file" id="pc-photo" accept="image/*">
          </label>
          <label>Currículo
            <input type="file" id="pc-resume" accept="image/*,.pdf">
          </label>
          <label>Carteira de trabalho (se CLT)
            <input type="file" id="pc-work-card" accept="image/*,.pdf">
          </label>

          <button type="submit" class="btn btn-primary" id="pc-submit">Enviar meus dados</button>
        </form>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="colaborador-publico.js"></script>
</body>
</html>
