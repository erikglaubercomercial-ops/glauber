<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Peregrinos Intercâmbio</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <img class="auth-logo" src="assets/peregrinos-logo-stacked.png" alt="Peregrinos Intercâmbio">
    </div>

    <h1 class="auth-title">Bem-vindo de volta</h1>
    <p class="auth-subtitle">Entre com sua conta para acessar o CRM.</p>

    <form id="login-form" class="auth-form">
      <label>E-mail
        <input type="email" id="login-email" required placeholder="voce@empresa.com" autocomplete="username">
      </label>
      <label>Senha
        <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
      </label>

      <div class="auth-error" id="login-error" style="display:none;"></div>

      <button type="submit" class="btn btn-primary auth-submit">Entrar</button>
    </form>
  </div>

  <script src="config.js?v=1790028144"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
